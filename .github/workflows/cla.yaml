name: cla

# CLA Assistant Lite needs pull_request_target to comment on and record
# signatures for pull requests from forks. The job never checks out or runs
# pull request code: its only step is the pinned action, which reads the pull
# request's commits and comments through the API and writes signatures to the
# cla-signatures branch.
on: # zizmor: ignore[dangerous-triggers]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

# Signatures are written to one file; runs for the same pull request queue
# instead of racing on its contents.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
      && (github.event.comment.body == 'recheck'
      || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    permissions:
      actions: write # re-runs the failed check after a signature
      contents: write # commits signatures to the cla-signatures branch
      pull-requests: write # comments on the pull request
    steps:
      # The upstream repository is archived; v2.6.1 is its last release and is
      # pinned by commit, so it cannot change under this workflow.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1 # zizmor: ignore[archived-uses]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Arturgrr/librelog/blob/main/CLA.md
          branch: cla-signatures
          # The maintainer's coding-agent commits are matched by the GitHub
          # account their email links to ("claude"), or by their git author
          # name ("Claude") when no account is linked; the match is
          # case-sensitive.
          allowlist: Arturgrr,claude,Claude,dependabot[bot],github-actions[bot],claude[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          lock-pullrequest-aftermerge: false
