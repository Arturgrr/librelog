[package]
name = "tauri-plugin-dictation"
version = "0.1.0"
edition = "2024"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-dictation"

[features]
# Lets "Pause media" pause a browser on macOS; direct distribution only.
macos-private-api = ["anlg-recording-environment/macos-private-api"]

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
specta-typescript = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true }

[dependencies]
anlg-audio = { workspace = true }
anlg-audio-device = { workspace = true }
anlg-dictation-core = { workspace = true }
anlg-recording-environment = { workspace = true }
owhisper-client = { workspace = true }
owhisper-interface = { workspace = true }
url = { workspace = true }

futures-util = { workspace = true }
hound = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

tauri = { workspace = true, features = ["test"] }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

[target.'cfg(target_os = "macos")'.dependencies]
anlg-dictation-ui-macos = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { workspace = true, features = ["NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
anlg-desktop-portal = { workspace = true }
arboard = { version = "3.6", features = ["wayland-data-control"] }
# remote_desktop does not build without screencast in ashpd 0.13.
ashpd = { workspace = true, features = ["tokio", "remote_desktop", "screencast"] }
atspi = { version = "0.25", default-features = false, features = ["tokio"] }
x11rb = { version = "0.13", features = ["xtest"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { workspace = true, features = ["net"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
