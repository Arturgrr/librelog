[package]
name = "tauri-plugin-capture"
version = "0.1.0"
edition = "2024"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-capture"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
specta-typescript = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[dependencies]
anlg-annotate-macos = { workspace = true }
anlg-capture-core = { workspace = true }

base64 = { workspace = true }
image = { workspace = true, features = ["gif", "jpeg", "png"] }
plist = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }

tauri = { workspace = true, features = ["test"] }
tauri-plugin-opener = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

[features]
default = []
# Turning macOS's own screenshot shortcuts off runs `defaults import`; only
# for builds outside the App Store.
system-shortcuts = []

[target.'cfg(target_os = "linux")'.dependencies]
# The card and area windows load files from the captures folder.
tauri = { workspace = true, features = ["protocol-asset"] }
anlg-desktop-portal = { workspace = true }
ashpd = { workspace = true, features = ["screencast", "screenshot", "tokio"] }
futures-util = { workspace = true }
gif = "0.14"
libc = "0.2"
url = { workspace = true }
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { workspace = true, features = ["NSError", "NSFileManager", "NSString", "NSURL"] }
